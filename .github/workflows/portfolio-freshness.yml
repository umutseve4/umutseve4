name: portfolio-freshness

# Read-only freshness monitor for PUBLIC repositories.
#
# The schedule below was enabled on 2026-09-06 only after three manual runs
# proved the whole path end to end:
#   run #1 (dry_run)  -> 29 public repos scanned, 0 missing values, real topic
#                        counts (the API does return `topics` on this endpoint)
#   run #2            -> tracking issue #6 created, label auto-created by GitHub
#   run #3            -> the SAME issue was updated (no duplicate), and the
#                        "previous report" stamp rendered correctly
# That third run is what makes a weekly cron safe: without proven idempotency
# a schedule would open a fresh issue every Saturday.
#
# The minute is deliberately off the top of the hour: GitHub delays or drops
# schedules that pile up at :00. Note also that a PUBLIC repository with no
# activity for 60 days has its scheduled workflows automatically disabled --
# the generation timestamp inside the issue is how you notice that happening.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece rapor bas, issue'ya yazma"
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 6'   # Cumartesi 03:17 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-freshness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (pinned, no credential persistence)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No setup-python: the runner ships Python 3, and the script uses only the
      # standard library. One less pinned third-party action = smaller supply chain.
      - name: Self-test (offline, no network, no writes)
        run: python3 scripts/test_portfolio_freshness.py

      - name: Run audit and update the single tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OWNER: umutseve4
          CONTROL_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/portfolio_freshness.py
